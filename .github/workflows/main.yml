name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Unsigned App (Auto Detect)
        run: |
          # Tự động quét tìm tên Scheme chuẩn xác
          SCHEME=$(xcodebuild -list | grep -A 1 "Schemes:" | tail -n 1 | sed 's/^[ \t]*//;s/[ \t]*$//')
          echo "Scheme tìm thấy: $SCHEME"
          
          # Thực thi lệnh build với Scheme tự động
          xcodebuild clean build -scheme "$SCHEME" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -sdk iphoneos -derivedDataPath build
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          # Tự động quét tìm thư mục .app vừa sinh ra để đóng gói
          find build -type d -name "*.app" -exec cp -R {} Payload/ \;
          zip -r FilmCamera.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmCamera-IPA
          path: FilmCamera.ipa

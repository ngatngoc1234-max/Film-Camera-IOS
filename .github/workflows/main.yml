name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Patch Xcode Format & Build
        run: |
          PBXPROJ="Film Camera.xcodeproj/project.pbxproj"
          
          echo "=== 1. Hạ định dạng project (110 -> 60) để Xcode 26.6 đọc được ==="
          sed -i '' 's/objectVersion = 110;/objectVersion = 60;/g' "$PBXPROJ"
          sed -i '' 's/minimizedProjectReferenceProxies = 1;//g' "$PBXPROJ"
          sed -i '' 's/preferredProjectObjectVersion = 110;//g' "$PBXPROJ"
          
          echo "=== 2. Đặt target 26.0 khớp với SDK 26.5 của GitHub (chạy nguyên bản trên iOS 27) ==="
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 26.0;/g' "$PBXPROJ"
          
          echo "=== 3. Sửa dòng 24 AdjustmentsSheet giúp trình biên dịch không bị quá tải ==="
          sed -i '' 's/\$camera.adjustments\[dynamicMember: control.keyPath\]/Bindable(camera).adjustments[dynamicMember: control.keyPath]/g' "Film Camera/Views/Adjustments/AdjustmentsSheet.swift"
          
          echo "=== 4. Bắt đầu Build ==="
          xcodebuild clean build \
            -project "Film Camera.xcodeproj" \
            -scheme "Film Camera" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/build"
            
      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" -type d -name "*.app" | head -n 1)
          echo "Đóng gói file: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r FilmCamera.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmCamera-IPA
          path: FilmCamera.ipa

name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Patch Xcode Format & Build
        run: |
          PBXPROJ="Film Camera.xcodeproj/project.pbxproj"
          
          echo "=== Hạ cấp định dạng Xcode Project (110 -> 60) ==="
          sed -i '' 's/objectVersion = 110;/objectVersion = 60;/g' "$PBXPROJ"
          sed -i '' 's/minimizedProjectReferenceProxies = 1;//g' "$PBXPROJ"
          sed -i '' 's/preferredProjectObjectVersion = 110;//g' "$PBXPROJ"
          
          echo "=== Hạ yêu cầu phiên bản iOS xuống 16.0 để tương thích mọi máy ==="
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' "$PBXPROJ"
          
          echo "=== Kiểm tra danh sách Schemes ==="
          xcodebuild -project "Film Camera.xcodeproj" -list
          
          echo "=== Bắt đầu Build ==="
          xcodebuild clean build \
            -project "Film Camera.xcodeproj" \
            -scheme "Film Camera" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/build"
            
      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" -type d -name "*.app" | head -n 1)
          echo "Đóng gói file: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r FilmCamera.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmCamera-IPA
          path: FilmCamera.ipa

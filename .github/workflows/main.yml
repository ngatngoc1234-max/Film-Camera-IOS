name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Unsigned App
        run: |
          xcodebuild clean build -project "Film Camera.xcodeproj" -scheme "Film Camera" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -sdk iphoneos -derivedDataPath build
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          mv "build/Build/Products/Debug-iphoneos/Film Camera.app" Payload/ || mv build/Build/Products/*-iphoneos/*.app Payload/
          zip -r FilmCamera.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmCamera-IPA
          path: FilmCamera.ipa
